
<div style="display:flex;flex-direction:column;gap:32px;">
  <div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
      <span style="font-size:14px;font-weight:500;color:var(--text-primary);">Sum of residuals — cancels out</span>
      <span id="stat1" style="font-size:13px;color:var(--text-secondary);"></span>
    </div>
    <div style="position:relative;width:100%;height:220px;">
      <canvas id="c1" role="img" aria-label="Scatter of data points with a line where positive and negative residuals cancel to zero"></canvas>
    </div>
  </div>
  <div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
      <span style="font-size:14px;font-weight:500;color:var(--text-primary);">Sum of absolute residuals — median line</span>
      <span id="stat2" style="font-size:13px;color:var(--text-secondary);"></span>
    </div>
    <div style="position:relative;width:100%;height:220px;">
      <canvas id="c2" role="img" aria-label="Scatter of data points with the median regression line and absolute residual segments"></canvas>
    </div>
  </div>
  <div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
      <span style="font-size:14px;font-weight:500;color:var(--text-primary);">Sum of squared residuals — OLS line</span>
      <span id="stat3" style="font-size:13px;color:var(--text-secondary);"></span>
    </div>
    <div style="position:relative;width:100%;height:220px;">
      <canvas id="c3" role="img" aria-label="Scatter of data points with the OLS regression line and squared residual boxes"></canvas>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const x = [1,2,3,4,5];
const y = [2,5,5,9,20];

const sumXY = x.reduce((s,xi,i)=>s+xi*y[i],0);
const sumX2 = x.reduce((s,xi)=>s+xi*xi,0);
const sumX = x.reduce((s,xi)=>s+xi,0);
const sumY = y.reduce((s,yi)=>s+yi,0);

const mZero = sumY/sumX;
const mOLS = sumXY/sumX2;

let bestAbs = Infinity, mMedian = 0;
for(let m=0;m<=6;m+=0.01){
  const s = x.reduce((acc,xi,i)=>acc+Math.abs(y[i]-m*xi),0);
  if(s<bestAbs){bestAbs=s; mMedian=m;}
}

function resid(m){ return x.map((xi,i)=> y[i]-m*xi); }
const e1 = resid(mZero);
const e2 = resid(mMedian);
const e3 = resid(mOLS);

document.getElementById('stat1').textContent = 'sum e = ' + e1.reduce((a,b)=>a+b,0).toFixed(2);
document.getElementById('stat2').textContent = 'sum |e| = ' + e2.reduce((a,b)=>a+Math.abs(b),0).toFixed(2);
document.getElementById('stat3').textContent = 'sum e^2 = ' + e3.reduce((a,b)=>a+b*b,0).toFixed(2);

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const ink = isDark ? '#c3c2b7' : '#52514e';
const grid = isDark ? '#2c2c2a' : '#e1e0d9';
const blue = isDark ? '#3987e5' : '#2a78d6';
const orange = isDark ? '#d95926' : '#eb6834';
const green = '#0ca30c';
const red = '#d03b3b';

function residualPlugin(m, mode){
  return {
    id: 'residuals_'+mode+'_'+m,
    afterDatasetsDraw(chart){
      const {ctx, scales:{x:xs, y:ys}} = chart;
      ctx.save();
      x.forEach((xi,i)=>{
        const px = xs.getPixelForValue(xi);
        const py1 = ys.getPixelForValue(y[i]);
        const py2 = ys.getPixelForValue(m*xi);
        const e = y[i]-m*xi;
        const col = e>=0 ? green : red;
        if(mode==='square'){
          const side = Math.abs(py1-py2);
          ctx.fillStyle = col + '33';
          ctx.strokeStyle = col;
          ctx.lineWidth = 1;
          const top = Math.min(py1,py2);
          ctx.fillRect(px, top, side, side);
          ctx.strokeRect(px, top, side, side);
        } else {
          ctx.setLineDash([4,3]);
          ctx.strokeStyle = col;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px,py1);
          ctx.lineTo(px,py2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });
      ctx.restore();
    }
  };
}

function makeChart(id, m, mode){
  new Chart(document.getElementById(id), {
    data:{
      datasets:[
        {type:'line', data:[{x:0,y:0},{x:5.5,y:m*5.5}], borderColor:blue, borderWidth:2, pointRadius:0, fill:false},
        {type:'scatter', data:x.map((xi,i)=>({x:xi,y:y[i]})), backgroundColor:orange, pointRadius:6}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{type:'linear', min:0, max:5.5, ticks:{color:ink,font:{size:11}}, grid:{color:grid}, title:{display:true,text:'x',color:ink,font:{size:11}}},
        y:{min:-2, max:22, ticks:{color:ink,font:{size:11}}, grid:{color:grid}, title:{display:true,text:'y',color:ink,font:{size:11}}}
      }
    },
    plugins:[residualPlugin(m, mode)]
  });
}

makeChart('c1', mZero, 'line');
makeChart('c2', mMedian, 'line');
makeChart('c3', mOLS, 'square');
</script>
